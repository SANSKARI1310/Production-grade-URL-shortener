spring:
  application:
    name: production-grade-url-shortener

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      timeout: 2s

server:
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 20s

snowflake:
  worker-id: ${SNOWFLAKE_WORKER_ID:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
